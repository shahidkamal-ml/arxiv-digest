name: Weekly paper digest

on:
  schedule:
    # Mondays and Fridays at 13:00 UTC = 9am Eastern (EDT) / 8am (EST).
    # 1 = Monday, 5 = Friday.
    # GitHub cron is always UTC and can be delayed during peak load.
    - cron: "0 13 * * 1,5"
  workflow_dispatch:        # lets you trigger a test run by hand

permissions:
  contents: write           # needed to commit sent.json back

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and send papers
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python digest.py

      - name: Save what was sent
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent.json
          git diff --staged --quiet || git commit -m "chore: update sent papers"
          git push
